# Sample ConfigMaps and Secrets for ECR CronJob
# These are example configurations that need to be customized for your environment

---
# AWS credentials secret - REPLACE WITH YOUR ACTUAL VALUES
apiVersion: v1
kind: Secret
metadata:
  name: aws-envs
  namespace: kube-system
  labels:
    app: ecr-creds-update
    component: aws-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "YOUR_AWS_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "YOUR_AWS_SECRET_ACCESS_KEY"
  AWS_DEFAULT_REGION: "us-west-2"  # Change to your AWS region

---
# ECR registry configuration - REPLACE WITH YOUR ECR DETAILS
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecr-registry
  namespace: kube-system
  labels:
    app: ecr-creds-update
    component: ecr-config
data:
  DOCKER_SERVER: "123456789012.dkr.ecr.us-west-2.amazonaws.com"  # Your ECR registry URL
  DOCKER_USER: "AWS"
  DOCKER_EMAIL: "your-email@company.com"  # Replace with your email

---
# Namespace and secret configuration - CUSTOMIZE FOR YOUR NEEDS
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecr-namespace
  namespace: kube-system
  labels:
    app: ecr-creds-update
    component: namespace-config
data:
  SECRET_NAMESPACES: "default,production,staging"  # Comma-separated list of namespaces
  SECRET_NAME: "ecr-registry-secret"  # Name of the secret to update in each namespace